<!doctype html>
<html data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mod overview</title>
<style>
    /* 1.7.302: the big-picture page (separate from the CRM tabs)
       1.7.303: redesigned as a light card dashboard, readable font */
    :root {
        --bg: #f4f5f9; --card: #ffffff; --navy: #121a3a; --navy-2: #1d2752; --indigo: #5b6ee1;
        --text: #1d2233; --muted: #6b7185; --faint: #a3a8b8; --line: #e7e9f0; --hover: #eef0f7;
        --red: #e5484d; --red-bg: #fde8e8; --amber: #d98a00; --amber-bg: #fff3d6; --green: #1f9d6b; --green-bg: #e3f6ee;
        --shadow: 0 1px 2px rgba(18,26,58,.05), 0 4px 16px rgba(18,26,58,.05);
        --font: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
        color-scheme: light;
        --input: #f7f8fc; --chip: #f3f4f8; --th: #ffffff;
    }
    /* 1.7.304: dark mode (default; the moon / sun button switches) */
    :root[data-theme="dark"] {
        --bg: #0e1220; --card: #171c2e; --navy: #0b0f1c; --navy-2: #1c2338; --indigo: #6f7ff0;
        --text: #e6e9f2; --muted: #9aa1b8; --faint: #5f6680; --line: #262d45; --hover: #20263c;
        --red: #ff6b6b; --red-bg: rgba(255,107,107,.15); --amber: #f5b544; --amber-bg: rgba(245,181,68,.15); --green: #3ccf8e; --green-bg: rgba(60,207,142,.14);
        --shadow: 0 1px 2px rgba(0,0,0,.3); --input: #1c2338; --chip: #20263c; --th: #171c2e;
        color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.5 var(--font); }
    button, input, select { font: inherit; color: inherit; }
    button { cursor: pointer; }
    [hidden] { display: none !important; }

    .bar { background: var(--navy); color: #fff; padding: 12px 32px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
    .bar h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .01em; }
    .bar .status { color: #b9c0dc; font-size: 13px; }
    .bar .grow { flex: 1; }
    .bar input, .bar select { background: var(--navy-2); border: 1px solid #2c3766; color: #fff; border-radius: 8px; padding: 7px 10px; }
    .bar input::placeholder { color: #8c94b8; }
    .bar button { background: #fff; color: var(--navy); border: 0; border-radius: 8px; padding: 7px 14px; font-weight: 600; }
    .bar button.ghost { background: transparent; color: #fff; border: 1px solid #3a4677; }
    .bar button:disabled { opacity: .5; cursor: default; }

    .wrap { padding: 20px 32px 48px; max-width: 1500px; margin: 0 auto; }
    .tabs { display: flex; gap: 28px; margin: 4px 0 22px; }
    .tabs button { background: none; border: 0; padding: 4px 0; color: var(--muted); font-size: 15px; position: relative; }
    .tabs button.on { color: var(--text); font-weight: 600; }
    .tabs button.on::after { content: ""; position: absolute; left: 0; right: 60%; bottom: -4px; height: 2px; background: var(--navy); border-radius: 2px; }

    .card { background: var(--card); border-radius: 14px; box-shadow: var(--shadow); padding: 22px 24px; }
    .card h2 { margin: 0 0 12px; font-size: 17px; font-weight: 500; }
    .link { background: none; border: 0; padding: 0; color: var(--muted); font-size: 13px; letter-spacing: .06em; text-transform: uppercase; font-weight: 600; }
    .link:hover { color: var(--text); }

    .home { display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 20px; align-items: start; }
    .home .left { display: grid; gap: 20px; min-width: 0; }
    .row1 { display: grid; grid-template-columns: 1fr 1.4fr; gap: 20px; }
    .hero { background: var(--navy); color: #fff; display: flex; flex-direction: column; justify-content: space-between; min-height: 200px; }
    .hero .label { font-size: 18px; color: #dfe3f3; }
    .hero .big { font-size: 56px; font-weight: 700; line-height: 1.1; margin: 6px 0; }
    .hero .sub { color: #aab2d4; font-size: 13px; }
    .hero .link { color: #c9cfea; margin-top: 14px; text-align: left; }
    .hero .link:hover { color: #fff; }
    .chart { display: flex; align-items: flex-end; gap: 10px; height: 120px; margin-top: 10px; }
    .chart .col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 6px; height: 100%; justify-content: flex-end; cursor: default; }
    .chart .b { width: 100%; max-width: 34px; background: var(--navy); border-radius: 4px 4px 0 0; min-height: 3px; }
    .chart .col.worst .b { background: var(--red); }
    .chart .d { font-size: 12px; color: var(--muted); }
    .callout { display: inline-block; background: var(--card); box-shadow: var(--shadow); border-radius: 10px; padding: 6px 12px; font-size: 13px; margin-bottom: 4px; }
    .callout b { font-weight: 600; }
    .callout span { color: var(--faint); }

    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; }
    .kpi { padding: 18px 20px; cursor: pointer; }
    .kpi:hover { box-shadow: 0 0 0 2px var(--hover), var(--shadow); }
    .kpi .top { color: var(--text); font-size: 14px; }
    .kpi .num { font-size: 32px; font-weight: 700; margin-top: 6px; }
    .kpi .help { color: var(--muted); font-size: 12px; }
    .delta { display: block; font-size: 12px; font-weight: 600; margin-bottom: 2px; }
    .delta.good { color: var(--green); } .delta.bad { color: var(--red); } .delta.flat { color: var(--faint); }

    .alert { display: flex; align-items: center; gap: 18px; }
    .alert .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--green); flex: none; }
    .alert.warn .dot { background: var(--red); box-shadow: 0 0 0 6px var(--red-bg); }
    .alert .t { flex: 1; }
    .alert .t b { display: block; font-size: 18px; font-weight: 600; }
    .alert .t span { color: var(--muted); }
    .btn-out { background: var(--input); border: 1px solid #d9ddec; color: var(--indigo); border-radius: 10px; padding: 10px 22px; font-weight: 600; }
    .btn-out:hover { background: var(--hover); }

    .row3 { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
    .list .li { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding: 8px 10px; margin: 0 -10px; border-radius: 8px; cursor: pointer; }
    .list .li:hover { background: var(--hover); }
    .list .li .n { color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .list .li .s { color: var(--muted); font-size: 12.5px; }
    .list .head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
    .list .head h2 { margin: 0; }
    .list .head span { font-size: 17px; }
    .empty { color: var(--muted); padding: 6px 0; }
    .meter { height: 6px; border-radius: 3px; background: var(--line); margin-top: 4px; overflow: hidden; }
    .meter i { display: block; height: 100%; background: var(--navy); }

    .indigo { background: var(--indigo); color: #fff; }
    .indigo h2 { color: #fff; }
    .indigo .l { color: #dbe0ff; font-size: 14px; margin-top: 14px; }
    .indigo .v { font-size: 34px; font-weight: 700; }

    .pill { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 12px; font-weight: 600; }
    .pill.red { background: var(--red-bg); color: var(--red); }
    .pill.amber { background: var(--amber-bg); color: var(--amber); }
    .pill.green { background: var(--green-bg); color: var(--green); }
    .pill.grey { background: var(--hover); color: var(--muted); }

    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px 10px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
    th { color: var(--muted); font-weight: 500; font-size: 12.5px; position: sticky; top: 0; background: var(--th); z-index: 1; }
    tr.city { cursor: pointer; }
    tr.city:hover td { background: var(--hover); }
    td.day { text-align: center; }
    .chip { display: inline-block; min-width: 46px; border-radius: 8px; padding: 3px 6px; font-weight: 600; font-size: 13px; font-variant-numeric: tabular-nums; }
    .chip.red { background: var(--red-bg); color: var(--red); }
    .chip.amber { background: var(--amber-bg); color: var(--amber); }
    .chip.ok { background: var(--chip); color: var(--muted); font-weight: 500; }
    .chip small { display: block; font-weight: 500; font-size: 11px; opacity: .85; }
    .ev { display: block; font-size: 11px; color: var(--indigo); font-weight: 600; margin-top: 2px; }
    .tablecard { padding: 8px 12px; overflow: auto; max-height: calc(100vh - 170px); }
    .legend { color: var(--muted); font-size: 12.5px; margin: 0 0 10px; display: flex; gap: 16px; flex-wrap: wrap; align-items: center; }

    .backdrop { position: fixed; inset: 0; background: rgba(18,26,58,.25); z-index: 10; }
    .drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(560px, 100vw); background: var(--bg); z-index: 11; overflow: auto; padding: 22px 24px 40px; box-shadow: -8px 0 30px rgba(18,26,58,.15); }
    .drawer .dh { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 14px; }
    .drawer .dh h2 { margin: 0; font-size: 24px; font-weight: 600; flex: 1; }
    .drawer .dh .sub { color: var(--muted); font-size: 13px; }
    .drawer .close { background: var(--card); color: var(--text); border: 1px solid var(--line); border-radius: 8px; width: 34px; height: 34px; font-size: 18px; line-height: 1; }
    .drawer .card { margin-bottom: 14px; padding: 18px 20px; }
    .drawer .card h3 { margin: 0 0 10px; font-size: 15px; font-weight: 600; }
    .act { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); }
    .act:first-of-type { border-top: 0; }
    .act input { margin-top: 4px; width: 16px; height: 16px; accent-color: #121a3a; }
    .act .w { color: var(--muted); font-size: 13px; }
    .act.done b { text-decoration: line-through; color: var(--faint); }
    .days { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .days button { border: 1px solid var(--line); background: var(--card); color: var(--text); border-radius: 8px; padding: 4px 10px; font-size: 13px; }
    .days button.on { background: var(--navy); color: #fff; border-color: var(--navy); }
    .hours { display: grid; grid-template-columns: repeat(24, 1fr); gap: 3px; align-items: end; height: 90px; }
    .hours div { background: var(--navy); border-radius: 3px 3px 0 0; opacity: .85; }
    .hours div.short { background: var(--red); opacity: 1; }
    .hours div.blk { background: var(--amber); }
    .hlabels { display: grid; grid-template-columns: repeat(24, 1fr); font-size: 10.5px; color: var(--faint); margin-top: 3px; }
    .facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 12px; }
    .facts div { background: var(--bg); border-radius: 10px; padding: 8px 10px; }
    .facts b { display: block; font-size: 18px; }
    .facts span { color: var(--muted); font-size: 12px; }
    .msg { padding: 10px 0; border-top: 1px solid var(--line); white-space: normal; }
    .msg:first-of-type { border-top: 0; }
    .msg .m { color: var(--muted); font-size: 12.5px; }
    .spark { width: 100%; height: 48px; }
    .note { color: var(--muted); font-size: 12.5px; }
    details.log { margin-top: 24px; color: var(--muted); font-size: 12.5px; }
    details.log div { white-space: pre-wrap; }
    .err { color: var(--red); }

    /* 1.7.304: period switch, where-to-act table, hour grid */
    .seg { display: flex; align-items: center; gap: 6px; margin-bottom: 18px; }
    .seg button { border: 1px solid var(--line); background: var(--card); color: var(--muted); border-radius: 10px; padding: 8px 18px; font-size: 15px; font-weight: 600; }
    .seg button.on { background: var(--indigo); border-color: var(--indigo); color: #fff; }
    .seg .note { margin-left: 10px; }
    .home2 > * + * { margin-top: 20px; }
    #main > .card, #main > .row3 { margin-top: 20px; }
    .card .head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 8px; flex-wrap: wrap; }
    .card .head h2 { margin: 0; }
    .kpi { cursor: default; }
    .kpi.warnv .num { color: var(--amber); }
    .kpi.badv .num { color: var(--red); }
    .s { color: var(--muted); font-size: 12.5px; }
    .bad { color: var(--red); font-weight: 600; }
    .act-table td { vertical-align: top; white-space: normal; }
    .act-table td:first-child { white-space: nowrap; }
    .mini { display: inline-block; width: 24px; text-align: center; border-radius: 5px; font-size: 11px; margin-right: 2px; padding: 1px 0; background: var(--chip); color: var(--muted); }
    .mini.red { background: var(--red-bg); color: var(--red); font-weight: 700; }
    .mini.amber { background: var(--amber-bg); color: var(--amber); font-weight: 700; }
    .grid { display: grid; grid-template-columns: 150px repeat(24, minmax(22px, 1fr)); gap: 3px; overflow-x: auto; }
    .gh { font-size: 11px; color: var(--faint); text-align: center; }
    .gl { font-size: 13px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 6px; cursor: pointer; align-self: center; }
    .gc { height: 26px; border-radius: 5px; background: var(--chip); font-size: 12px; font-weight: 700; display: flex; align-items: center; justify-content: center; cursor: pointer; color: var(--muted); }
    .gc.red { background: var(--red); color: #fff; }
    .gc.amber { background: var(--amber-bg); color: var(--amber); }
    .gc.ok { background: var(--green-bg); color: var(--green); }
    .gc.blk { background: repeating-linear-gradient(45deg, var(--chip), var(--chip) 4px, var(--amber-bg) 4px, var(--amber-bg) 8px); }
    .htable { margin-top: 10px; }
    .htable summary { cursor: pointer; color: var(--muted); font-size: 13px; }
    .htable td, .htable th { padding: 4px 8px; font-size: 13px; }
    .htable tr.shortrow td { color: var(--red); font-weight: 600; }
    .theme { background: transparent !important; color: #fff !important; border: 1px solid #3a4677 !important; min-width: 38px; }

    @media (max-width: 1250px) { .home { grid-template-columns: 1fr; } .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 800px) { .row1, .row3 { grid-template-columns: 1fr; } .wrap, .bar { padding-left: 16px; padding-right: 16px; } }
</style>
</head>
<body>
    <div class="bar">
        <h1>mod overview</h1>
        <span class="status" id="status">loading…</span>
        <span class="grow"></span>
        <input id="search" placeholder="Find a city" size="16">
        <select id="sort" title="How the cities list is sorted">
            <option value="action">Needs action first</option>
            <option value="gap">Most without a driver</option>
            <option value="loss">Biggest loss / week</option>
            <option value="cov">Fewest drivers per job</option>
            <option value="name">A to Z</option>
        </select>
        <button id="theme" class="theme" title="Dark / light">Light</button>
        <button id="refresh" title="Read every city from the CRM, plus the sheets, Slack and the hub">Refresh</button>
        <button id="full" class="ghost" hidden title="Read the CRM hours for all cities (about 20 minutes)">Read all cities</button>
    </div>
    <div class="wrap">
        <div class="tabs">
            <button class="on" data-tab="home">Home</button>
            <button data-tab="cities">Cities</button>
            <button data-tab="slack">Slack</button>
            <button data-tab="retro">Event retro</button>
            <button data-tab="month">Month</button>
        </div>
        <div id="main"></div>
        <details class="log"><summary>Activity log</summary><div id="log"></div></details>
    </div>
    <div class="backdrop" id="backdrop" hidden></div>
    <aside class="drawer" id="drawer" hidden></aside>
    <script src="overview.js"></script>
</body>
</html>
