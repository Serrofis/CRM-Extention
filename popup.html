<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mod</title>
<style>
    /* 1.7.271: the look of your web apps; 1.7.274: the director app's icon and mint */
    :root {
        --bg: #0b0b0b; --surface: #161616; --surface-2: #1f1f1f; --line: #232323;
        --text: #f4f1ee; --muted: #8d8a86; --faint: #6a6764;
        --accent: #6EE7B7; --on-accent: #0b0b0b; --danger: #F09595; --ok: #8fd6a8; --warn: #f2c27b;
        --radius: 12px;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); }
    body { width: 330px; font: 14px/1.4 var(--font); padding: 14px 14px 12px; }
    button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
    .head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
    .head img { width: 30px; height: 30px; border-radius: 8px; }
    .head h1 { flex: 1; margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -.02em; }
    .head h1::after { content: "."; color: var(--accent); }
    .head .ver { color: var(--faint); font-size: 11px; }
    .status { background: var(--surface); border-radius: var(--radius); padding: 11px 13px; margin-bottom: 10px; }
    .status .line1 { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 15px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
    .dot.on { background: var(--ok); } .dot.auto { background: var(--accent); } .dot.paused { background: var(--warn); } .dot.off { background: var(--faint); }
    .status .line2 { color: var(--muted); font-size: 12.5px; margin-top: 3px; }
    .list { background: var(--surface); border-radius: var(--radius); overflow: hidden; margin-bottom: 10px; }
    .row { display: flex; align-items: center; gap: 10px; padding: 9px 13px; border-top: 1px solid var(--line); }
    .row:first-child { border-top: 0; }
    .row .txt { flex: 1; min-width: 0; }
    .row .name { font-weight: 600; }
    .row .sub { color: var(--muted); font-size: 12px; }
    .sw { width: 38px; height: 22px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); position: relative; flex: none; transition: background .15s; }
    .sw::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: var(--muted); transition: transform .15s, background .15s; }
    .sw[aria-checked="true"] { background: var(--accent); border-color: var(--accent); }
    .sw[aria-checked="true"]::after { transform: translateX(16px); background: var(--on-accent); }
    .sw:disabled { opacity: .4; cursor: default; }
    .actions { display: flex; gap: 8px; margin-bottom: 10px; }
    .btn { flex: 1; display: inline-flex; align-items: center; justify-content: center; padding: 9px 12px; border-radius: 999px; background: var(--surface); font-weight: 600; }
    .btn.primary { background: var(--accent); color: var(--on-accent); }
    .btn:hover { filter: brightness(1.12); }
    .foot { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12px; padding: 2px 2px 0; }
    .foot .grow { flex: 1; }
    .note { color: var(--danger); font-size: 12px; margin: -4px 2px 8px; }
    [hidden] { display: none !important; }
</style>
</head>
<body>
    <div class="head">
        <img src="icon128.png" alt="">
        <h1>mod</h1>
        <span class="ver" id="ver"></span>
    </div>

    <div class="status">
        <div class="line1"><span class="dot" id="dot"></span><span id="state">Looking for the CRM…</span></div>
        <div class="line2" id="state2"></div>
    </div>
    <div class="note" id="note" hidden></div>

    <div class="list" id="switches"></div>

    <div class="actions">
        <button class="btn primary" id="open">Open Em Hailing</button>
        <button class="btn" id="term">Terminal</button>
        <button class="btn" id="wa" title="WhatsApp Web in the side panel — stays open when the CRM page refreshes">WhatsApp</button>
        <button class="btn" id="overview" title="The big picture: all cities, 7 days, events, EM policy, Slack (opens in its own tab)">Overview</button>
    </div>

    <div class="foot">
        <span class="grow">Extension on CRM pages</span>
        <button class="sw" id="enabled" role="switch" aria-checked="true" title="Turn the whole extension on or off on CRM pages (applies when a page loads)"></button>
    </div>
<script src="popup.js"></script>
</body>
</html>
